name: Alpha checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      REQUIRE_HTTP_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest --cov=backend --cov-report=term-missing --cov-report=xml -q
      - run: node --test tests/extension.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-coverage
          path: coverage.xml
